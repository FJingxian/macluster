name: Release macOS binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
      TARGET: aarch64-apple-darwin
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target "$TARGET"
          rustup default 1.90.0

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/release/tests -v

      - name: Verify tag matches workspace version
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import pathlib
          import re
          import sys

          tag = sys.argv[1]
          version = re.search(
              r'(?ms)^\[workspace\.package\]\s*.*?^version = "([^"]+)"',
              pathlib.Path("Cargo.toml").read_text(),
          ).group(1)
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match workspace version v{version}")
          print(f"release version: {version}")
          PY

      - name: Prepare isolated test home permissions
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

      - name: Run workspace unit tests
        run: cargo test --workspace --lib -- --test-threads=1

      - name: Build arm64 release binary
        run: cargo build --release --locked -p macluster-cli --target "$TARGET"

      - name: Verify release binary
        run: |
          BIN="target/$TARGET/release/macluster"
          test -x "$BIN"
          file "$BIN"
          file "$BIN" | grep -q "Mach-O 64-bit executable arm64"
          if test "$(uname -m)" = arm64; then
            "$BIN" --version | grep -F "macluster ${RELEASE_TAG#v}"
          fi

      - name: Validate Homebrew tap credentials
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          test -n "$HOMEBREW_TAP_SSH_KEY" || {
            echo "::error::HOMEBREW_TAP_SSH_KEY is not configured"
            exit 1
          }

      - name: Import Developer ID certificate when configured
        env:
          MACLUSTER_CODESIGN_P12_BASE64: ${{ secrets.MACLUSTER_CODESIGN_P12_BASE64 }}
          MACLUSTER_CODESIGN_P12_PASSWORD: ${{ secrets.MACLUSTER_CODESIGN_P12_PASSWORD }}
          MACLUSTER_CODESIGN_IDENTITY: ${{ secrets.MACLUSTER_CODESIGN_IDENTITY }}
          MACLUSTER_NOTARY_APPLE_ID: ${{ secrets.MACLUSTER_NOTARY_APPLE_ID }}
          MACLUSTER_NOTARY_PASSWORD: ${{ secrets.MACLUSTER_NOTARY_PASSWORD }}
          MACLUSTER_NOTARY_TEAM_ID: ${{ secrets.MACLUSTER_NOTARY_TEAM_ID }}
        run: |
          if test -z "$MACLUSTER_CODESIGN_P12_BASE64" \
            && test -z "$MACLUSTER_CODESIGN_P12_PASSWORD" \
            && test -z "$MACLUSTER_CODESIGN_IDENTITY"; then
            echo "MACLUSTER_SIGNING_ENABLED=0" >> "$GITHUB_ENV"
            echo "Developer ID secrets are not configured; release will use explicit ad-hoc signing."
            exit 0
          fi
          test -n "$MACLUSTER_CODESIGN_P12_BASE64" || {
            echo "::error::MACLUSTER_CODESIGN_P12_BASE64 is not configured"
            exit 1
          }
          test -n "$MACLUSTER_CODESIGN_P12_PASSWORD" || {
            echo "::error::MACLUSTER_CODESIGN_P12_PASSWORD is not configured"
            exit 1
          }
          test -n "$MACLUSTER_CODESIGN_IDENTITY" || {
            echo "::error::MACLUSTER_CODESIGN_IDENTITY is not configured"
            exit 1
          }
          test -n "$MACLUSTER_NOTARY_APPLE_ID" || {
            echo "::error::MACLUSTER_NOTARY_APPLE_ID is not configured"
            exit 1
          }
          test -n "$MACLUSTER_NOTARY_PASSWORD" || {
            echo "::error::MACLUSTER_NOTARY_PASSWORD is not configured"
            exit 1
          }
          test -n "$MACLUSTER_NOTARY_TEAM_ID" || {
            echo "::error::MACLUSTER_NOTARY_TEAM_ID is not configured"
            exit 1
          }
          certificate="$RUNNER_TEMP/macluster-developer-id.p12"
          keychain="$RUNNER_TEMP/macluster-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACLUSTER_CODESIGN_P12_BASE64" \
            | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACLUSTER_CODESIGN_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain"
          security find-identity -v -p codesigning "$keychain" \
            | grep -F "$MACLUSTER_CODESIGN_IDENTITY"
          {
            echo "MACLUSTER_SIGNING_ENABLED=1"
            echo "MACLUSTER_CODESIGN_IDENTITY=$MACLUSTER_CODESIGN_IDENTITY"
            echo "MACLUSTER_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Sign release with Developer ID
        if: env.MACLUSTER_SIGNING_ENABLED == '1'
        run: |
          python3 scripts/release/sign_macos.py \
            --binary "target/$TARGET/release/macluster" \
            --identity "$MACLUSTER_CODESIGN_IDENTITY" \
            --keychain "$MACLUSTER_SIGNING_KEYCHAIN" \
            --distribution-only
          codesign -dv --verbose=4 "target/$TARGET/release/macluster"

      - name: Ad-hoc sign release binary
        if: env.MACLUSTER_SIGNING_ENABLED != '1'
        run: |
          python3 scripts/release/sign_macos.py \
            --binary "target/$TARGET/release/macluster" \
            --allow-adhoc

      - name: Notarize Developer ID release
        if: env.MACLUSTER_SIGNING_ENABLED == '1'
        env:
          MACLUSTER_NOTARY_APPLE_ID: ${{ secrets.MACLUSTER_NOTARY_APPLE_ID }}
          MACLUSTER_NOTARY_PASSWORD: ${{ secrets.MACLUSTER_NOTARY_PASSWORD }}
          MACLUSTER_NOTARY_TEAM_ID: ${{ secrets.MACLUSTER_NOTARY_TEAM_ID }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            "target/$TARGET/release/macluster" \
            dist/macluster-notary.zip
          xcrun notarytool submit dist/macluster-notary.zip \
            --apple-id "$MACLUSTER_NOTARY_APPLE_ID" \
            --password "$MACLUSTER_NOTARY_PASSWORD" \
            --team-id "$MACLUSTER_NOTARY_TEAM_ID" \
            --wait

      - name: Package signed release
        run: |
          python3 scripts/release/package_macos.py \
            --binary "target/$TARGET/release/macluster" \
            --version "${RELEASE_TAG#v}" \
            --output-dir dist
          cd dist
          shasum -a 256 -c SHA256SUMS
          tar -tzvf ./*.tar.gz

      - name: Generate Homebrew formula
        run: |
          SHA256="$(awk '{print $1}' dist/SHA256SUMS)"
          python3 scripts/release/homebrew_formula.py \
            --version "${RELEASE_TAG#v}" \
            --sha256 "$SHA256" \
            --output dist/macluster.rb
          ruby -c dist/macluster.rb

      - name: Create GitHub Release
        run: |
          if test "$MACLUSTER_SIGNING_ENABLED" = "1"; then
            signature_en="Developer ID signed and Apple notarized"
            signature_zh="Developer ID 签名并通过 Apple 公证"
          else
            signature_en="ad-hoc signed"
            signature_zh="ad-hoc 签名"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## English

          macluster $RELEASE_TAG is a $signature_en Apple silicon build.

          Homebrew (after the tap is published):

          \`\`\`sh
          brew install FJingxian/macluster/macluster
          \`\`\`

          See the commit history for the complete change list.

          ## 简体中文

          macluster $RELEASE_TAG 是 $signature_zh Apple silicon 版本。

          Homebrew 安装（tap 发布后）：

          \`\`\`sh
          brew install FJingxian/macluster/macluster
          \`\`\`

          完整改动请查看 commit 记录。
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/macluster-v*-macos-arm64.tar.gz \
              dist/SHA256SUMS \
              dist/macluster.rb \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              dist/macluster-v*-macos-arm64.tar.gz \
              dist/SHA256SUMS \
              dist/macluster.rb \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          TAP_REPOSITORY="${TAP_REPOSITORY:-FJingxian/homebrew-macluster}"
          TAP_DIR="$RUNNER_TEMP/homebrew-macluster"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$HOMEBREW_TAP_SSH_KEY" > "$HOME/.ssh/macluster-homebrew-deploy-key"
          chmod 600 "$HOME/.ssh/macluster-homebrew-deploy-key"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/macluster-homebrew-deploy-key -o IdentitiesOnly=yes"
          git clone "git@github.com:${TAP_REPOSITORY}.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          cp dist/macluster.rb "$TAP_DIR/Formula/macluster.rb"
          git -C "$TAP_DIR" config user.name "github-actions[bot]"
          git -C "$TAP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TAP_DIR" add Formula/macluster.rb
          if git -C "$TAP_DIR" diff --cached --quiet; then
            echo "Homebrew formula is already current."
            exit 0
          fi
          git -C "$TAP_DIR" commit -m "macluster ${RELEASE_TAG#v}"
          git -C "$TAP_DIR" push origin HEAD:main
